<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Prompt Coach · Evaluación</title>
<link rel="icon" href="data:,">
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#14213D',
            'secondary-text': '#5B6577',
            'teal-brand': '#0F5C5A',
            'canvas-bg': '#EEF1EC',
            marker: '#FFE45C'
          },
          fontFamily: {
            title: ['"Bricolage Grotesque"', 'sans-serif'],
            body: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    };
  </script>
<style>
    body {
      background-color: #EEF1EC;
      color: #14213D;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
      /* Clases que escribe static/app.js (contrato en docs/GUIA-STITCH.md, sección 4) */
    .status { min-height: 1.25rem; font-size: .875rem; color: #5B6577; }
    .status.error { color: #D64545; font-weight: 600; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .score { --pct: 0; --c: #D64545; position: relative; isolation: isolate; width: 11rem; height: 11rem; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: conic-gradient(var(--c) calc(var(--pct) * 1%), #EEF1EC 0);
      font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 3rem; line-height: 1; color: #14213D; }
    .score::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #fff; z-index: -1; }
    .score small { display: block; font-size: .9rem; font-weight: 600; color: #5B6577; margin-top: .35rem; }
    .score.high { --c: #1F9D6B; } .score.mid { --c: #C98A00; } .score.low { --c: #D64545; }
    .checks { display: flex; flex-direction: column; gap: .625rem; list-style: none; padding: 0; margin: 0; }
    .checks li { display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; border-radius: .75rem;
      background: rgba(238,241,236,.6); border-left: 3px solid; font-size: .875rem; font-weight: 600; color: #14213D; }
    .checks li.ok { border-color: #1F9D6B; } .checks li.fail { border-color: #D64545; }
    .checks .mark { width: 1.25rem; height: 1.25rem; flex: none; border-radius: 50%; display: grid; place-items: center;
      font: 700 .75rem 'JetBrains Mono', monospace; }
    .checks li.ok .mark { background: rgba(31,157,107,.15); color: #1F9D6B; }
    .checks li.fail .mark { background: rgba(214,69,69,.15); color: #D64545; }
    .checks li::after { margin-left: auto; font-size: .75rem; padding: .125rem .625rem; border-radius: 999px; white-space: nowrap; }
    .checks li.ok::after { content: "Cumplida"; color: #1F9D6B; background: rgba(31,157,107,.1); }
    .checks li.fail::after { content: "Pendiente"; color: #D64545; background: rgba(214,69,69,.1); }
    .suggest { counter-reset: s; display: flex; flex-direction: column; gap: 1rem; list-style: none; padding: 0; margin: 0; }
    .suggest li { counter-increment: s; display: flex; gap: 1rem; align-items: flex-start; padding: 1rem; border-radius: .75rem;
      background: rgba(238,241,236,.4); border: 1px solid rgba(15,92,90,.05); color: #14213D; font-size: .95rem; line-height: 1.6; }
    .suggest li::before { content: counter(s); flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%;
      background: rgba(15,92,90,.1); color: #0F5C5A; font: 700 .875rem 'JetBrains Mono', monospace; display: grid; place-items: center; }
    .changes { display: flex; flex-direction: column; gap: .875rem; list-style: none; padding: 0; margin: 0; }
    .changes li { display: flex; gap: .75rem; align-items: flex-start; padding: .875rem; border-radius: .75rem;
      background: #F9FAF8; border: 1px solid #EEF1EC; color: #14213D; font-size: .875rem; line-height: 1.6; }
    .changes li::before { content: ""; flex: none; width: .375rem; height: .375rem; border-radius: 50%; background: #0F5C5A; margin-top: .55rem; }
  </style>
</head>
<body data-page="evaluacion" class="min-h-screen bg-[#EEF1EC] text-[#14213D] antialiased selection:bg-[#0F5C5A]/15 selection:text-[#0F5C5A]">
<div class="max-w-[840px] mx-auto px-4 sm:px-6 pt-8 pb-20">
<!-- 1. Header flotante en píldora despegada arriba -->
<header class="bg-white/85 backdrop-blur-md rounded-full px-6 py-3.5 shadow-[0_12px_30px_-8px_rgba(15,92,90,0.07)] border border-white/80 flex items-center justify-between mb-8">
<!-- Logo e Identidad -->
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-[#0F5C5A] flex items-center justify-center text-white shadow-sm">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" viewbox="0 0 24 24">
<path d="M12 3H7a4 4 0 0 0 0 8h5a4 4 0 0 1 0 8H7"></path>
<path d="M7 11V3"></path>
</svg>
</div>
<span class="font-title font-bold text-lg tracking-tight text-[#14213D]">Prompt Coach</span>
</div>
<!-- Etiqueta IA activa -->
<div class="flex items-center gap-2 px-3 py-1 rounded-full border border-[#0F5C5A]/15 bg-[#0F5C5A]/[0.08]">
<span class="w-1.5 h-1.5 rounded-full bg-[#0F5C5A]"></span>
<span class="font-body text-[13px] font-medium text-[#0F5C5A]" id="mode-badge">IA activa</span>
</div>
</header>
<!-- 2. Stepper flotante centrado en píldora -->
<div class="flex justify-center mb-8">
<nav aria-label="Progreso" class="inline-flex items-center bg-white/90 backdrop-blur-md px-2 py-1.5 rounded-full border border-[rgba(15,92,90,0.08)] shadow-[0_8px_20px_-6px_rgba(15,92,90,0.05)] gap-1">
<!-- Paso 1: Inactivo -->
<span class="text-[#5B6577] px-4 py-2 text-sm font-medium hover:text-[#14213D] transition-colors cursor-pointer">
          1 · Escribir
        </span>
<!-- Paso 2: Activo -->
<span class="bg-[#0F5C5A] text-white px-5 py-2 rounded-full font-medium text-sm shadow-[0_4px_12px_rgba(15,92,90,0.2)] transition-all">
          2 · Evaluar
        </span>
<!-- Paso 3: Inactivo -->
<span class="text-[#5B6577] px-4 py-2 text-sm font-medium">
          3 · Mejorar
        </span>
</nav>
</div>
<!-- Flujo vertical en una sola columna -->
<main class="flex flex-col gap-6 w-full">
<section class="bg-white/70 backdrop-blur-md p-1.5 rounded-[28px] shadow-[0_20px_40px_-15px_rgba(15,92,90,0.07),0_0_0_1px_rgba(15,92,90,0.08)]">
<div class="bg-white rounded-[24px] p-6 sm:p-8 flex flex-col shadow-[inset_0_1px_0_0_rgba(255,255,255,0.9)]">
<div class="pb-6 border-b border-[rgba(15,92,90,0.06)] mb-6">
<h1 class="font-title text-2xl sm:text-3xl font-bold text-[#14213D] tracking-tight">Resultado de la evaluación</h1>
</div>
<div class="grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
<div class="md:col-span-5 flex flex-col items-center justify-center text-center p-2">
<div class="score" id="score" aria-label="Puntaje"></div>
<p class="font-body text-sm text-[#5B6577] max-w-xs mt-4" id="verdict"></p>
</div>
<ul class="checks md:col-span-7" id="checks"></ul>
</div>
</div>
</section>
<section class="bg-white/70 backdrop-blur-md p-1.5 rounded-[28px] shadow-[0_20px_40px_-15px_rgba(15,92,90,0.07),0_0_0_1px_rgba(15,92,90,0.08)]">
<div class="bg-white rounded-[24px] p-6 sm:p-8 flex flex-col shadow-[inset_0_1px_0_0_rgba(255,255,255,0.9)]">
<div class="flex items-center gap-2 mb-6">
<span class="w-2.5 h-2.5 rounded-full bg-[#0F5C5A]"></span>
<h2 class="font-title text-xl sm:text-2xl font-bold text-[#14213D] tracking-tight">Qué mejorar</h2>
</div>
<ul class="suggest" id="suggestions"></ul>
</div>
</section>
<section class="bg-white/70 backdrop-blur-md p-1.5 rounded-[28px] shadow-[0_20px_40px_-15px_rgba(15,92,90,0.07),0_0_0_1px_rgba(15,92,90,0.08)]">
<div class="bg-white rounded-[24px] p-6 sm:p-7 flex flex-col shadow-[inset_0_1px_0_0_rgba(255,255,255,0.9)]">
<span class="font-body text-xs font-semibold uppercase tracking-wider text-[#5B6577] mb-3">Prompt original</span>
<div class="bg-[#EEF1EC]/70 rounded-xl p-4 font-mono text-sm sm:text-base text-[#14213D] border border-[rgba(15,92,90,0.07)] leading-relaxed whitespace-pre-wrap break-words" id="prompt-echo"></div>
</div>
</section>
<div class="flex flex-col sm:flex-row items-center gap-4 pt-2">
<button class="group flex-1 w-full sm:w-auto bg-[#0F5C5A] hover:bg-[#0b4745] active:scale-[0.99] text-white pl-7 pr-2.5 py-3.5 rounded-full font-body font-semibold text-sm sm:text-base transition-all duration-200 shadow-[0_12px_24px_-8px_rgba(15,92,90,0.35)] flex items-center justify-between gap-4 cursor-pointer" id="btn-mejorar" type="button">
<span>Mejorar mi prompt</span>
<div class="w-8 h-8 rounded-full bg-white/15 flex items-center justify-center shrink-0 transition-transform group-hover:translate-x-0.5">
<svg class="w-4 h-4 text-white stroke-[2]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M12 5l7 7-7 7"></path></svg>
</div>
</button>
<a class="w-full sm:w-auto bg-white hover:bg-white/85 active:scale-[0.99] text-[#14213D] px-8 py-3.5 rounded-full font-body font-semibold text-sm sm:text-base transition-all duration-200 border border-[#D9DED3] shadow-[0_4px_12px_rgba(15,92,90,0.04)] text-center cursor-pointer" href="/views/escribir.html">Editar</a>
</div>
<p class="status" id="status" role="status" aria-live="polite"></p>
</main>
</div>
<script src="/static/app.js"></script>
</body></html>
