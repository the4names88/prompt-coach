<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Coach · Prompt mejorado</title>
  <link rel="icon" href="data:,">
  <!-- Google Fonts: Bricolage Grotesque, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            canvas: '#EEF1EC',
            ink: '#14213D',
            muted: '#5B6577',
            accent: '#0F5C5A',
            'accent-hover': '#0b4745',
            'accent-light': '#E6F0EE',
            marker: '#FFE45C',
            borderline: '#D9DED3',
            success: '#1F9D6B',
          },
          fontFamily: {
            display: ['"Bricolage Grotesque"', 'sans-serif'],
            body: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          boxShadow: {
            'floating': '0 20px 40px -15px rgba(15, 92, 90, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.9) inset',
            'inner-glow': 'inset 0 1px 2px rgba(255, 255, 255, 0.8), 0 12px 32px -8px rgba(15, 92, 90, 0.06)',
            'btn': '0 8px 20px -4px rgba(15, 92, 90, 0.25)',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #EEF1EC;
      color: #14213D;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .double-frame-outer {
      background: rgba(255, 255, 255, 0.45);
      border: 1px solid rgba(217, 222, 211, 0.7);
      padding: 6px;
      border-radius: 34px;
      box-shadow: 0 20px 40px -15px rgba(15, 92, 90, 0.07);
    }
    .double-frame-inner {
      background: #FFFFFF;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.95);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.9), 0 2px 8px rgba(15, 92, 90, 0.03);
    }
    .marker-bg {
      background-color: rgba(255, 228, 92, 0.4);
    }
      /* Clases que escribe static/app.js (contrato en docs/GUIA-STITCH.md, sección 4) */
    .status { min-height: 1.25rem; font-size: .875rem; color: #5B6577; }
    .status.error { color: #D64545; font-weight: 600; }
    button:disabled { opacity: .6; cursor: not-allowed; }
    .score { --pct: 0; --c: #D64545; position: relative; isolation: isolate; width: 11rem; height: 11rem; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: conic-gradient(var(--c) calc(var(--pct) * 1%), #EEF1EC 0);
      font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 3rem; line-height: 1; color: #14213D; }
    .score::before { content: ""; position: absolute; inset: 10px; border-radius: 50%; background: #fff; z-index: -1; }
    .score small { display: block; font-size: .9rem; font-weight: 600; color: #5B6577; margin-top: .35rem; }
    .score.high { --c: #1F9D6B; } .score.mid { --c: #C98A00; } .score.low { --c: #D64545; }
    .checks { display: flex; flex-direction: column; gap: .625rem; list-style: none; padding: 0; margin: 0; }
    .checks li { display: flex; align-items: center; gap: .75rem; padding: .75rem 1rem; border-radius: .75rem;
      background: rgba(238,241,236,.6); border-left: 3px solid; font-size: .875rem; font-weight: 600; color: #14213D; }
    .checks li.ok { border-color: #1F9D6B; } .checks li.fail { border-color: #D64545; }
    .checks .mark { width: 1.25rem; height: 1.25rem; flex: none; border-radius: 50%; display: grid; place-items: center;
      font: 700 .75rem 'JetBrains Mono', monospace; }
    .checks li.ok .mark { background: rgba(31,157,107,.15); color: #1F9D6B; }
    .checks li.fail .mark { background: rgba(214,69,69,.15); color: #D64545; }
    .checks li::after { margin-left: auto; font-size: .75rem; padding: .125rem .625rem; border-radius: 999px; white-space: nowrap; }
    .checks li.ok::after { content: "Cumplida"; color: #1F9D6B; background: rgba(31,157,107,.1); }
    .checks li.fail::after { content: "Pendiente"; color: #D64545; background: rgba(214,69,69,.1); }
    .suggest { counter-reset: s; display: flex; flex-direction: column; gap: 1rem; list-style: none; padding: 0; margin: 0; }
    .suggest li { counter-increment: s; display: flex; gap: 1rem; align-items: flex-start; padding: 1rem; border-radius: .75rem;
      background: rgba(238,241,236,.4); border: 1px solid rgba(15,92,90,.05); color: #14213D; font-size: .95rem; line-height: 1.6; }
    .suggest li::before { content: counter(s); flex: none; width: 1.75rem; height: 1.75rem; border-radius: 50%;
      background: rgba(15,92,90,.1); color: #0F5C5A; font: 700 .875rem 'JetBrains Mono', monospace; display: grid; place-items: center; }
    .changes { display: flex; flex-direction: column; gap: .875rem; list-style: none; padding: 0; margin: 0; }
    .changes li { display: flex; gap: .75rem; align-items: flex-start; padding: .875rem; border-radius: .75rem;
      background: #F9FAF8; border: 1px solid #EEF1EC; color: #14213D; font-size: .875rem; line-height: 1.6; }
    .changes li::before { content: ""; flex: none; width: .375rem; height: .375rem; border-radius: 50%; background: #0F5C5A; margin-top: .55rem; }
  </style>
</head>
<body data-page="mejorado" class="min-h-screen py-10 px-4 flex flex-col items-center justify-start">

  <main class="w-full max-w-[840px] flex flex-col gap-8">

    <!-- 1. HEADER FLOTANTE -->
    <header class="w-full bg-white/80 backdrop-blur-md border border-white/90 rounded-full px-6 py-3.5 flex items-center justify-between shadow-floating">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-full bg-accent flex items-center justify-center text-white font-mono font-bold text-sm tracking-tight shadow-sm">
          PC
        </div>
        <span class="font-display font-bold text-lg tracking-tight text-ink">Prompt Coach</span>
      </div>
      <div class="flex items-center gap-2 bg-[#F1F5EE] px-3.5 py-1.5 rounded-full border border-[#D9DED3]/60">
        <span class="w-2 h-2 rounded-full bg-success"></span>
        <span class="text-xs font-semibold text-accent tracking-wide" id="mode-badge">IA activa</span>
      </div>
    </header>

    <!-- STEPPER FLOTANTE (3 · Mejorar ACTIVO) -->
    <nav aria-label="Progreso" class="self-center bg-white/90 backdrop-blur-md border border-white rounded-full p-1.5 shadow-floating flex items-center gap-1.5 text-xs font-semibold">
      <div class="px-4 py-2 rounded-full text-muted flex items-center gap-1.5">
        <span>1 · Escribir</span>
      </div>
      <div class="px-4 py-2 rounded-full text-muted flex items-center gap-1.5">
        <span>2 · Evaluar</span>
      </div>
      <div class="px-4 py-2 rounded-full bg-accent text-white flex items-center gap-1.5 shadow-sm">
        <span>3 · Mejorar</span>
      </div>
    </nav>

    
    <!-- Título y modo -->
    <section class="flex flex-col gap-1.5 px-2">
      <h1 class="font-display font-extrabold text-3xl sm:text-4xl tracking-tight text-ink">Tu prompt mejorado</h1>
      <p class="text-sm font-semibold text-accent flex items-center gap-2">
        <span class="w-1.5 h-1.5 rounded-full bg-accent"></span>
        <span id="mode"></span>
      </p>
    </section>

    <!-- Antes y después -->
    <section class="double-frame-outer">
      <div class="double-frame-inner p-6 sm:p-8 flex flex-col gap-6">
        <div class="border-b border-[#EEF1EC] pb-4">
          <h2 class="font-display font-bold text-lg text-ink">Antes y después</h2>
        </div>
        <div class="flex flex-col gap-5">
          <div class="flex flex-col gap-2">
            <div class="text-xs font-semibold text-muted">Original · <span id="score-before"></span>/100</div>
            <div class="bg-[#F7F9F6] border border-[#D9DED3]/70 rounded-2xl px-5 py-3.5 font-mono text-sm text-ink/90 whitespace-pre-wrap break-words" id="original"></div>
          </div>
          <div class="flex flex-col gap-2">
            <div class="text-xs text-accent font-bold">Mejorado · <span id="score-after"></span>/100 · <span id="score-delta"></span></div>
            <div class="marker-bg border border-[#FFE45C] rounded-2xl p-5 sm:p-6 font-mono text-sm text-ink leading-relaxed whitespace-pre-wrap break-words" id="improved"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Qué cambió -->
    <section class="double-frame-outer">
      <div class="double-frame-inner p-6 sm:p-8 flex flex-col gap-5">
        <h2 class="font-display font-bold text-lg text-ink flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-accent"></span>
          Qué cambió
        </h2>
        <ul class="changes" id="changes"></ul>
      </div>
    </section>

    <!-- Acciones -->
    <section class="flex flex-col sm:flex-row items-center gap-4 pt-2">
      <button class="w-full sm:w-auto min-h-[48px] px-7 py-3 rounded-full bg-accent hover:bg-accent-hover text-white font-medium text-sm flex items-center justify-center gap-3 shadow-btn transition-colors" id="btn-copiar" type="button">
        <span>Copiar prompt mejorado</span>
        <span class="w-6 h-6 rounded-full bg-white/20 flex items-center justify-center">
          <svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
        </span>
      </button>
      <button class="w-full sm:w-auto min-h-[48px] px-7 py-3 rounded-full bg-white hover:bg-[#F9FAF8] text-ink font-medium text-sm border border-borderline shadow-sm transition-colors" id="btn-nuevo" type="button">Probar otro prompt</button>
    </section>
    <p class="status pb-12" id="status" role="status" aria-live="polite"></p>

  </main>
  <script src="/static/app.js"></script>
</body>
</html>
